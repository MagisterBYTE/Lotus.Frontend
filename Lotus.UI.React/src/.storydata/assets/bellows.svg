<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org">
  <!-- Фоновый круг -->
  <circle cx="100" cy="100" r="95" fill="#f4e4bc" stroke="#4a3728" stroke-width="5" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#4a3728" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Меха (дерево и кожа) -->
  <g transform="rotate(-15 100 100)" stroke="#1a1a1a" stroke-width="1.5">
    <!-- Рукоятки (дерево) -->
    <rect x="50" y="90" width="100" height="15" fill="#7d5a3c" rx="5" />
    <rect x="50" y="110" width="100" height="15" fill="#7d5a3c" rx="5" />

    <!-- Кожаная часть (основной объем) -->
    <path d="M150 90 Q170 100 150 125 L90 125 L95 110 L90 90 Z" fill="#6d4c41" />
    <!-- Нижний клапан (темнее) -->
    <path d="M90 90 L150 90 L145 88 L85 88 Z" fill="#5d4037" />
    <!-- Сопло (металл) -->
    <rect x="80" y="105" width="15" height="5" fill="#424242" stroke="#1a1a1a" stroke-width="1" />
  </g>

  <!-- Декоративные элементы (как в иконке кузни) -->
  <path d="M40 100 Q10 100 10 70" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5" />
  <path d="M160 100 Q190 100 190 130" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5" />
</svg>