<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org">
  <!-- Фоновый круг -->
  <circle cx="100" cy="100" r="95" fill="#f4e4bc" stroke="#4a3728" stroke-width="5" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#4a3728" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Бак / Бочка -->
  <g transform="translate(0, 10)" stroke="#1a1a1a" stroke-width="2">
    <!-- Деревянные стенки -->
    <path d="M60 90 L140 90 Q150 140 140 160 L60 160 Q50 140 60 90 Z" fill="#7d5a3c" />
    <!-- Металлические обручи (светлый металл) -->
    <rect x="55" y="90" width="90" height="8" fill="#b0bec5" rx="2" />
    <rect x="55" y="152" width="90" height="8" fill="#b0bec5" rx="2" />
    <!-- Вода внутри (темно-синий) -->
    <path d="M62 98 L138 98 Q140 150 138 158 L62 158 Q60 150 62 98 Z" fill="#263238" /> 
  </g>
  
  <!-- Пар (над баком) -->
  <g transform="translate(10, -30)">
    <path d="M80 80 Q70 70 80 60 Q90 50 100 60 Q110 50 120 60 Q130 70 120 80 Z" fill="none" stroke="#b0bec5" stroke-width="2" opacity="0.7" />
    <circle cx="100" cy="50" r="4" fill="#b0bec5" opacity="0.5" />
  </g>


  <!-- Декоративные элементы -->
  <path d="M40 100 Q10 100 10 70" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5" />
  <path d="M160 100 Q190 100 190 130" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5" />
</svg>