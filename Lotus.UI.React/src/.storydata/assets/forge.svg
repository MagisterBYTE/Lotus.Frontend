<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org">
  <!-- Фоновый круг (эффект старой бумаги/металла) -->
  <circle cx="100" cy="100" r="95" fill="#f4e4bc" stroke="#4a3728" stroke-width="5" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#4a3728" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Наковальня -->
  <!-- Основной силуэт (темный) -->
  <path d="M50 140 L150 140 L140 120 L155 100 L155 80 L60 80 L45 100 L60 120 Z" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="70" y="140" width="60" height="15" fill="#2c2c2c" />
  <path d="M60 155 L140 155 L150 165 L50 165 Z" fill="#2c2c2c" />
  
  <!-- Верхняя рабочая поверхность (СВЕТЛАЯ часть, имитация блика) -->
  <path d="M60 80 L155 80 L150 75 L65 75 Z" fill="#b0bec5" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Молот (под углом) -->
  <g transform="rotate(-30 100 70)">
    <rect x="95" y="40" width="10" height="50" rx="2" fill="#5d4037" stroke="#3e2723" stroke-width="1"/>
    <rect x="80" y="30" width="40" height="25" rx="2" fill="#424242" stroke="#212121" stroke-width="2"/>
  </g>

  <!-- Искры -->
  <circle cx="130" cy="75" r="3" fill="#ff6f00" />
  <circle cx="145" cy="85" r="2" fill="#ff8f00" />
  <circle cx="135" cy="95" r="2.5" fill="#ffa000" />

  <!-- Декоративные элементы -->
  <path d="M40 100 Q10 100 10 70" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5"/>
  <path d="M160 100 Q190 100 190 130" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5"/>
</svg>
