<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org">
  <!-- Фоновый круг -->
  <circle cx="100" cy="100" r="95" fill="#f4e4bc" stroke="#4a3728" stroke-width="5" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#4a3728" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Верстак -->
  <g stroke="#1a1a1a" stroke-width="2">
    <!-- Столешница (Светлое дерево) -->
    <rect x="50" y="80" width="100" height="20" fill="#a07d5a" rx="3"/>
    <!-- Ножки -->
    <rect x="55" y="100" width="15" height="60" fill="#7d5a3c"/>
    <rect x="130" y="100" width="15" height="60" fill="#7d5a3c"/>
    <!-- Нижняя полка -->
    <rect x="60" y="140" width="80" height="10" fill="#a07d5a"/>
  </g>
  
  <!-- Инструменты на верстаке -->
  <g transform="translate(-10, 0)">
    <!-- Пила -->
    <path d="M65 85 L95 85 L95 95 L65 95 L68 92 L65 89 Z" fill="#424242" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Ручка пилы -->
    <path d="M60 85 Q60 80 65 80 L68 85 Z" fill="#5d4037" stroke="#3e2723" stroke-width="1"/>
  </g>
  <g transform="translate(10, 0)">
     <!-- Молоток на верстаке (светлый металл) -->
    <rect x="115" y="86" width="30" height="10" fill="#b0bec5" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="130" y="86" width="4" height="15" fill="#7d5a3c" stroke="#3e2723" stroke-width="1"/>
  </g>


  <!-- Декоративные элементы (как в иконке кузни) -->
  <path d="M40 100 Q10 100 10 70" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5"/>
  <path d="M160 100 Q190 100 190 130" fill="none" stroke="#4a3728" stroke-width="2" opacity="0.5"/>
</svg>